const state = { selected:new Set(DATA.districts.map(key)) };
const fmt = n => (n==null?'—':Math.round(n).toLocaleString());
const pct = (a,b)=> (a==null||b==null||b==0)?'':((a-b)/b*100);
const pctTxt = p => p===''? '' : (p>=0?'+':'')+p.toFixed(1)+'%';

// ---------- map ----------
let map = L.map('map',{zoomControl:true}).setView([25.03,121.50],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);
let markerLayer = L.layerGroup().addTo(map);

function radius(uj){ return uj==null?4 : 3+Math.sqrt(uj)*0.62; }
function color(s){ if(s.um==null||s.uj==null) return '#888'; const d=s.uj-s.um; if(d>2) return '#1F7A4D'; if(d<-2) return '#C0392B'; return '#C99A2E'; }

function renderMap(){
  markerLayer.clearLayers();
  const pts=[];
  DATA.stations.forEach(s=>{
    if(!state.selected.has(s.city+'|'+s.dist)) return;
    const m=L.circleMarker([s.lat,s.lng],{radius:radius(s.uj),color:'#fff',weight:1,fillColor:color(s),fillOpacity:.82});
    const p=pct(s.uj,s.um), rp = (s.rm!=null&&s.rj!=null)?((s.rj-s.rm)*100):null;
    m.bindPopup('<div class="pp"><b>'+s.name+'</b><br><span class="k">'+s.city+' '+s.dist+'</span><br>'+
      '用量：'+fmt(s.um)+' → '+fmt(s.uj)+' <b class="'+(p>=0?'':'')+'" style="color:'+(p>=0?'#1F7A4D':'#C0392B')+'">'+pctTxt(p)+'</b><br>'+
      '見車率6–24：'+(s.rm!=null?(s.rm*100).toFixed(0)+'%':'—')+' → '+(s.rj!=null?(s.rj*100).toFixed(0)+'%':'—')+(rp!=null?' ('+(rp>=0?'+':'')+rp.toFixed(1)+'pp)':'')+
      '</div>');
    m.addTo(markerLayer); pts.push([s.lat,s.lng]);
  });
  if(pts.length){ try{ map.fitBounds(pts,{padding:[30,30],maxZoom:14}); }catch(e){} }
}

// ---------- charts (SVG grouped bars) ----------
function barChart(elId, rows, keys, colors){
  // rows: [{label, a, b}]
  const el=document.getElementById(elId);
  if(!rows.length){ el.innerHTML='<div style="color:#8a94a3;font-size:12px;padding:20px">請選擇至少一個行政區</div>'; return; }
  const gW=Math.max(34, Math.min(60, 720/rows.length)); // group width
  const bw=gW*0.34, gap=gW*0.14;
  const W=rows.length*gW+40, H=210, pad=24, base=H-40;
  const max=Math.max(1,...rows.map(r=>Math.max(r.a,r.b)));
  let s='<svg width="'+W+'" height="'+H+'" font-family="Segoe UI,Microsoft JhengHei">';
  // gridlines
  for(let g=0;g<=2;g++){ const y=pad+(base-pad)*g/2; const v=Math.round(max*(1-g/2)); s+='<line x1="34" y1="'+y+'" x2="'+W+'" y2="'+y+'" stroke="#eef1f5"/><text x="30" y="'+(y+3)+'" font-size="9" fill="#9aa4b2" text-anchor="end">'+v.toLocaleString()+'</text>'; }
  rows.forEach((r,i)=>{
    const x0=40+i*gW;
    const ha=(base-pad)*r.a/max, hb=(base-pad)*r.b/max;
    s+='<rect x="'+(x0)+'" y="'+(base-ha)+'" width="'+bw+'" height="'+ha+'" fill="'+colors[0]+'" rx="1.5"/>';
    s+='<rect x="'+(x0+bw+3)+'" y="'+(base-hb)+'" width="'+bw+'" height="'+hb+'" fill="'+colors[1]+'" rx="1.5"/>';
    const d=r.b-r.a, dp=r.a?((d/r.a)*100):0;
    s+='<text x="'+(x0+bw+1.5)+'" y="'+(base-Math.max(ha,hb)-4)+'" font-size="9" font-weight="700" fill="'+(d>=0?'#1F7A4D':'#C0392B')+'" text-anchor="middle">'+(d>=0?'+':'')+dp.toFixed(0)+'%</text>';
    s+='<text x="'+(x0+bw+1.5)+'" y="'+(base+12)+'" font-size="9.5" fill="#3a4453" text-anchor="middle">'+r.label+'</text>';
  });
  s+='</svg>';
  el.innerHTML=s;
}

function selectedDistricts(){
  return DATA.districts.filter(d=>state.selected.has(key(d)));
}
function renderCharts(){
  let ds=selectedDistricts();
  const v=ds.filter(d=>d.veh_m!=null).slice().sort((a,b)=>(b.veh_l-b.veh_m)-(a.veh_l-a.veh_m))
           .map(d=>({label:d.dist.replace('區',''),a:d.veh_m,b:d.veh_l}));
  barChart('chartVeh', v, ['3月','上週'], ['#c9b28a','#8a6d3b']);
  const u=ds.slice().sort((a,b)=>(b.tot_j-b.tot_m)-(a.tot_j-a.tot_m))
           .map(d=>({label:d.dist.replace('區',''),a:d.tot_m,b:d.tot_j}));
  barChart('chartUse', u, ['3月','7月'], ['#9db8dd','#2E5496']);
}

// ---------- summary ----------
function renderSummary(){
  const ds=selectedDistricts();
  let vm=0,vl=0,tm=0,tj=0,n=0,haveV=false;
  ds.forEach(d=>{ if(d.veh_m!=null){vm+=d.veh_m;vl+=d.veh_l;haveV=true;} tm+=d.tot_m;tj+=d.tot_j;n+=d.n;});
  const vP=vm?((vl-vm)/vm*100):0, uP=tm?((tj-tm)/tm*100):0;
  const el=document.getElementById('summary');
  el.innerHTML=
   badge('選取行政區', ds.length+' 區', '共 '+n+' 個A級站')+
   badge('配車數 3月→上週', haveV?fmt(vm)+' → '+fmt(vl):'—', haveV?arrow(vl-vm)+' '+pctTxt(vP):'')+
   badge('全區總用量 3月→7月', fmt(tm)+' → '+fmt(tj), arrow(tj-tm)+' '+pctTxt(uP))+
   badge('每車用量比 (7月)', haveV&&vl?(tj/vl).toFixed(1):'—', haveV?'3月 '+(vm?(tm/vm).toFixed(1):'—'):'');
}
function arrow(d){ return '<small class="'+(d>=0?'up':'down')+'">'+(d>=0?'▲':'▼')+'</small>'; }
function badge(lab,val,sub){ return '<div class="badge"><div class="lab">'+lab+'</div><div class="val">'+val+' '+(sub||'')+'</div></div>'; }

    ds.forEach(d=>{
      const dv=(d.veh_m!=null)?('車'+(d.veh_l-d.veh_m>=0?'+':'')+(d.veh_l-d.veh_m)):'';
      html+='<label class="row"><input type="checkbox" data-k="'+key(d)+'" checked onchange="onToggle(this)"><span class="dn">'+d.dist+'</span><span class="dv">'+dv+'</span></label>';
    });
    html+='</div>';
  });
  el.innerHTML=html;
}
function onToggle(cb){ const k=cb.getAttribute('data-k'); if(cb.checked)state.selected.add(k); else state.selected.delete(k); renderAll(); }
function selAll(v){ document.querySelectorAll('#dlist input').forEach(cb=>{cb.checked=v; const k=cb.getAttribute('data-k'); if(v)state.selected.add(k);else state.selected.delete(k);}); renderAll(); }
function toggleCity(city){
  const boxes=[...document.querySelectorAll('#dlist input')].filter(cb=>cb.getAttribute('data-k').startsWith(city+'|'));
  const anyOff=boxes.some(cb=>!cb.checked); boxes.forEach(cb=>{cb.checked=anyOff; const k=cb.getAttribute('data-k'); if(anyOff)state.selected.add(k);else state.selected.delete(k);}); renderAll();
}
function renderAll(){ renderSummary(); renderMap(); renderCharts(); }

buildSidebar(); renderAll();
setTimeout(()=>map.invalidateSize(),200);
</script>
